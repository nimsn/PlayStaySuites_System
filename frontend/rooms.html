<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rooms | PlayStaySuites</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav id="nav"></nav>
<main id="app"></main>
<script src="js/app.js"></script>
<script>
initCrud({
  title: 'Rooms',
  endpoint: '/rooms',        // INNER JOIN: rooms + room_types (+ amenities as a comma-separated string)
  idKey: 'room_id',
  columns: [
    { key: 'room_number', label: 'Room' },
    { key: 'type_name', label: 'Type' },
    { key: 'base_rate', label: 'Base rate', render: r => peso(r.base_rate) },
    { key: 'max_capacity', label: 'Max capacity' },
    { key: 'floor_level', label: 'Floor' },
    { key: 'amenities', label: 'Amenities', render: r => r.amenities ? esc(r.amenities) : '<span class="mute">None</span>' },
    { key: 'current_status', label: 'Status', render: r => badge(r.current_status) },
  ],
  fields: [
    { key: 'room_number', label: 'Room number' },
    { key: 'room_type_id', label: 'Room type', type: 'select', from: { url: '/room-types', value: 'room_type_id', label: o => o.type_name } },
    { key: 'floor_level', label: 'Floor level', type: 'number' },
    { key: 'current_status', label: 'Status', type: 'select', options: ['Available', 'Occupied', 'Maintenance', 'Cleaning'] },
  ],
});
</script>
</body>
</html>
