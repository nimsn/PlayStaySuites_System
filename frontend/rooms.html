<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rooms | PlayStaySuites</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav"></nav>
<main id="app"></main>
<script src="app.js"></script>
<script>
initCrud({
  title: 'Rooms',
  subtitle: 'Room inventory, rates, amenities and current status.',
  endpoint: '/rooms',
  studentCanAdd: false,        
  idKey: 'room_id',
  columns: [
    { key: 'room_number', label: 'Room' },
    { key: 'floor_level', label: 'Floor' },
    { key: 'type_name', label: 'Type' },
    { key: 'base_rate_per_hour', label: 'Base rate per hour', render: r => peso(r.base_rate) },
    { key: 'max_capacity', label: 'Max capacity' },
    { key: 'amenities', label: 'Amenities', render: r => r.amenities ? `<div class="amenity-tags">${r.amenities.split(',').map(name => `<span class="amenity-tag">${esc(name.trim())}</span>`).join('')}</div>` : '<span class="mute">None listed</span>' },
    { key: 'current_status', label: 'Status', render: r => badge(r.current_status) },
  ],
  fields: [
    { key: 'room_number', label: 'Room number' },
    { key: 'floor_level', label: 'Floor level', type: 'number', step: 1 },
    { key: 'room_type_id', label: 'Room type', type: 'select', from: { url: '/rooms/types', value: 'room_type_id', label: o => o.type_name } },
    { key: 'current_status', label: 'Status', type: 'select', options: ['Available', 'Occupied', 'Maintenance', 'Cleaning'] },
    { key: 'amenity_ids', label: 'Room amenities', type: 'checkboxes', required: false, help: 'Select the amenities physically assigned to this room. Customers can view these details but cannot change them.', from: { url: '/amenities', value: 'amenity_id', label: o => `${o.amenity_name}${o.price ? ` (+${peso(o.price)})` : ''}` } },
  ],
});
</script>
</body>
</html>
