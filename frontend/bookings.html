<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookings | PlayStaySuites</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav"></nav>
<main id="app"></main>

<dialog id="svcDlg" class="dialog" aria-labelledby="svcTitle">
  <div class="dialog-head">
    <h2 id="svcTitle">Services</h2>
    <button type="button" class="btn sm ghost" id="svcClose">Close</button>
  </div>
  <div id="svcList" class="dialog-body"></div>
  <form id="svcForm" class="dialog-form">
    <label>Service<select id="svcSelect" required></select></label>
    <label>Quantity<input id="svcQty" type="number" min="1" max="99" step="1" value="1" required></label>
    <button class="btn" id="svcAdd">Add</button>
  </form>
</dialog>

<script src="app.js"></script>
<script>

const currentUser = getCurrentUser();
const isStudent = currentUser?.role === 'Student';

const FLOW = {
  Reserved: [['Check in', 'Active']],
  Active: [['Check out', 'Completed']],
};

const PROMO_FIELD = {
  key: 'promo_code',
  label: 'Promo (optional)',
  type: 'select',
  required: false,
  placeholder: 'No promo',
  from: {
    url: '/promos/active',
    value: 'promo_code',
    label: o => `${o.promo_code} - ${Number(o.discount_percentage)}% off${o.valid_until ? ` (until ${fmt(o.valid_until)})` : ''}`,
  },
};

let ROOMS = [], PROMOS = [];
const lookups = Promise.all([api('/rooms'), isStudent ? Promise.resolve([]) : api('/promos/active')])
  .then(([rooms, promos]) => { ROOMS = rooms; PROMOS = promos; })
  .catch(() => {});

const preview = v => {
  const room = ROOMS.find(r => String(r.room_id) === String(v.room_id));
  if (!room) return '<span class="mute">Pick a room to see its rate and amenities.</span>';

  const out = [
    `<div><b>${esc(room.room_number)}</b> &middot; ${esc(room.type_name)} &middot; floor ${esc(room.floor_level)} &middot; up to ${esc(room.max_capacity)} people &middot; ${peso(room.base_rate)}/hour</div>`,
    `<div class="mute">Amenities: ${room.amenities ? esc(room.amenities) : 'none listed'}</div>`,
  ];
  if (room.current_status === 'Maintenance') {
    out.push('<div class="warn">This room is under maintenance and cannot be booked right now.</div>');
  }

  const start = new Date(v.check_in_time), end = new Date(v.check_out_time);
  if (!v.check_in_time || !v.check_out_time || isNaN(start) || isNaN(end) || end <= start) {
    out.push('<div class="mute">Choose check-in and check-out times to see the price.</div>');
    return out.join('');
  }

  const hours = Math.max(1, Math.ceil((end - start) / 36e5));
  const baseCents = hours * Math.round(Number(room.base_rate) * 100);
  const promo = PROMOS.find(p => p.promo_code === v.promo_code);
  const discountCents = promo ? Math.round((baseCents * Number(promo.discount_percentage)) / 100) : 0;

  out.push(`<div>${hours} hour${hours === 1 ? '' : 's'} &times; ${peso(room.base_rate)} = ${peso(baseCents / 100)}</div>`);
  if (promo) out.push(`<div>Promo ${esc(promo.promo_code)} (-${Number(promo.discount_percentage)}%): -${peso(discountCents / 100)}</div>`);
  out.push(`<div class="total">Estimated total: ${peso((baseCents - discountCents) / 100)}</div>`);
  out.push('<small>Estimate only. The final price is calculated when you save.</small>');
  return out.join('');
};

initCrud({
  title: 'Bookings',
  subtitle: isStudent ? 'Choose a room and reservation time. Staff can apply eligible promotions at the front desk.' : 'Create reservations, apply promotions when appropriate, then check guests in and out.',
  endpoint: '/bookings',
  idKey: 'booking_id',

  studentCanAdd: true,
  canEdit: false,
  canDelete: r => r.booking_status === 'Reserved',
  deleteLabel: 'Cancel booking',
  onDelete: async r => {
    const reason = prompt(`Cancel booking #${r.booking_id}?\nReason (optional). Press OK to cancel the booking, or Cancel to keep it.`, '');
    if (reason === null) return false;
    await api(`/bookings/${r.booking_id}`, 'DELETE', { reason: reason.trim() });
    toast('Booking cancelled');
  },

  columns: [
    { key: 'booking_id', label: 'ID' },
    { key: 'customer_name', label: 'Customer' },
    { key: 'room_number', label: 'Room' },
    { key: 'check_in_time', label: 'Check-in', render: r => fmt(r.check_in_time) },
    { key: 'check_out_time', label: 'Check-out', render: r => fmt(r.check_out_time) },
    { key: 'total_amount', label: 'Room total', render: r => peso(r.total_amount) },
    { key: 'services_total', label: 'Add-ons', render: r => (Number(r.services_total) ? peso(r.services_total) : '<span class="mute">-</span>') },
    { key: 'promo_code', label: 'Promo', render: r => (r.promo_code ? `${esc(r.promo_code)} <span class="mute">(saved ${peso(r.discount_amount)})</span>` : '<span class="mute">-</span>') },
    { key: 'booking_status', label: 'Status', render: r => badge(r.booking_status) },
  ],

  fields: isStudent ? [
    {
      key: 'room_id',
      label: 'Room',
      type: 'select',
      from: {
        url: '/rooms',
        value: 'room_id',
        label: o => `${o.room_number} (${o.type_name})`
      }
    },
    { key: 'check_in_time', label: 'Check-in time', type: 'datetime-local' },
    { key: 'check_out_time', label: 'Check-out time', type: 'datetime-local' },
  ] : [
    {
      key: 'user_id',
      label: 'Customer',
      type: 'select',
      from: {
        url: '/users/customers',
        value: 'user_id',
        label: o => `${o.first_name} ${o.last_name}`
      }
    },
    {
      key: 'room_id',
      label: 'Room',
      type: 'select',
      from: {
        url: '/rooms',
        value: 'room_id',
        label: o => `${o.room_number} (${o.type_name})`
      }
    },
    { key: 'check_in_time', label: 'Check-in time', type: 'datetime-local' },
    { key: 'check_out_time', label: 'Check-out time', type: 'datetime-local' },
    PROMO_FIELD,
  ],

  validate: b =>
    (b.check_out_time <= b.check_in_time
      ? 'Check-out must be after check-in.'
      : ''),

  actions: r => [
    ...(FLOW[r.booking_status] || []).map(([label, status]) => ({
      label,
      run: async () => {
        await api(`/bookings/${r.booking_id}/status`, 'PATCH', {
          booking_status: status
        });

        toast(`Booking ${status.toLowerCase()}`);
      },
    })),
    ...(['Reserved', 'Active'].includes(r.booking_status)
      ? [{ label: 'Services', run: () => openServices(r) }]
      : []),
  ],

  preview,
}).then(ctrl => {
  if (ctrl) reloadTable = ctrl.reload;
  return lookups;
}).then(() => {
  const form = document.getElementById('f');
  if (form) form.dispatchEvent(new Event('input', { bubbles: true }));
});

let reloadTable = () => {};
let openBookingId = null;
const dlg = document.getElementById('svcDlg');
const svcList = document.getElementById('svcList');
const svcSelect = document.getElementById('svcSelect');
const svcAdd = document.getElementById('svcAdd');

async function renderServiceLines() {
  svcList.innerHTML = `<div class="page-loading" role="status">${spinner('Loading services…')}</div>`;
  try {
    const lines = await api(`/bookings/${openBookingId}/services`);
    if (!lines.length) {
      svcList.innerHTML = '<p class="mute">No add-on services on this booking yet.</p>';
      return;
    }
    const total = lines.reduce((sum, l) => sum + Number(l.subtotal), 0);
    svcList.innerHTML = `<table><thead><tr><th>Service</th><th>Qty</th><th>Subtotal</th><th></th></tr></thead><tbody>${lines.map(l => `
      <tr><td data-label="Service">${esc(l.service_name)} <span class="mute">${peso(l.unit_price)} each</span></td>
      <td data-label="Qty">${esc(l.quantity)}</td>
      <td data-label="Subtotal">${peso(l.subtotal)}</td>
      <td class="acts"><button type="button" class="btn sm danger" data-line="${esc(l.booking_service_id)}">Remove</button></td></tr>`).join('')}
      <tr><td colspan="2"><b>Add-ons total</b></td><td colspan="2"><b>${peso(total)}</b></td></tr></tbody></table>`;
  } catch (err) {
    svcList.innerHTML = `<p class="error">${esc(err.message)}</p>`;
  }
}

async function openServices(booking) {
  openBookingId = booking.booking_id;
  document.getElementById('svcTitle').textContent = `Services for booking #${booking.booking_id} (${booking.room_number})`;
  svcSelect.innerHTML = '<option value="">Loading…</option>';
  dlg.showModal();
  renderServiceLines();
  try {
    const catalog = await api('/services');
    svcSelect.innerHTML = '<option value="">Choose a service…</option>' +
      catalog.map(s => `<option value="${esc(s.service_id)}">${esc(s.service_name)} - ${peso(s.unit_price)}</option>`).join('');
  } catch (err) {
    svcSelect.innerHTML = `<option value="" disabled>${esc(err.message)}</option>`;
  }
}

document.getElementById('svcForm').onsubmit = async e => {
  e.preventDefault();
  svcAdd.disabled = true; svcAdd.textContent = 'Adding…';
  try {
    const res = await api(`/bookings/${openBookingId}/services`, 'POST', {
      service_id: Number(svcSelect.value),
      quantity: Number(document.getElementById('svcQty').value),
    });
    toast(res.hint || 'Service added to booking.');
    document.getElementById('svcQty').value = 1;
    await renderServiceLines();
  } catch (err) { toast(err.message, true); }
  finally { svcAdd.disabled = false; svcAdd.textContent = 'Add'; }
};

svcList.onclick = async e => {
  const b = e.target.closest('button[data-line]');
  if (!b) return;
  b.disabled = true;
  try {
    const res = await api(`/bookings/${openBookingId}/services/${b.dataset.line}`, 'DELETE');
    toast(res.hint || 'Service removed.');
    await renderServiceLines();
  } catch (err) { toast(err.message, true); b.disabled = false; }
};

document.getElementById('svcClose').onclick = () => dlg.close();
dlg.addEventListener('close', () => reloadTable()); 
</script>
</body>
</html>
