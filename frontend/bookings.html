<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookings | PlayStaySuites</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav id="nav"></nav>
<main id="app"></main>
<script src="js/app.js"></script>
<script>
const FLOW = {
  Reserved: [['Check in', 'Active'], ['Cancel', 'Cancelled']],
  Active:   [['Check out', 'Completed']],
};

initCrud({
  title: 'Bookings',
  endpoint: '/bookings',     
  idKey: 'booking_id',
  canEdit: false,            
  canDelete: false,
  columns: [
    { key: 'booking_id', label: 'ID' },
    { key: 'customer_name', label: 'Customer' },
    { key: 'room_number', label: 'Room' },
    { key: 'check_in_time', label: 'Check-in', render: r => fmt(r.check_in_time) },
    { key: 'check_out_time', label: 'Check-out', render: r => fmt(r.check_out_time) },
    { key: 'total_amount', label: 'Total', render: r => peso(r.total_amount) },
    { key: 'booking_status', label: 'Status', render: r => badge(r.booking_status) },
  ],
  fields: [
    { key: 'user_id', label: 'Customer', type: 'select', from: { url: '/users', value: 'user_id', label: o => `${o.first_name} ${o.last_name}` } },
    { key: 'room_id', label: 'Room', type: 'select', from: { url: '/rooms', value: 'room_id', label: o => `${o.room_number} (${o.type_name})` } },
    { key: 'check_in_time', label: 'Check-in time', type: 'datetime-local' },
    { key: 'check_out_time', label: 'Check-out time', type: 'datetime-local' },
  ],
  validate: b => (b.check_out_time <= b.check_in_time ? 'Check-out must be after check-in.' : ''),
  actions: r => (FLOW[r.booking_status] || []).map(([label, status]) => ({
    label,
    run: async () => {
      await api(`/bookings/${r.booking_id}/status`, 'PATCH', { booking_status: status });
      toast(`Booking ${status.toLowerCase()}`);
    },
  })),
});
</script>
</body>
</html>
