<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Services | PlayStaySuites</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav"></nav>
<main id="app"></main>
<script src="app.js"></script>
<script>
initCrud({
  title: 'Services',
  subtitle: 'The catalog of add-on services (printing, snacks, equipment). Staff attach them to a booking from the Bookings page, and they are billed on the invoice.',
  endpoint: '/services',
  idKey: 'service_id',
  // A service that was already billed on a booking can't be deleted (it would erase billing history)
  canDelete: r => !Number(r.times_used),
  columns: [
    { key: 'service_id', label: 'ID' },
    { key: 'service_name', label: 'Service' },
    { key: 'category', label: 'Category', render: r => esc(r.category || '-') },
    { key: 'unit_price', label: 'Unit price', render: r => peso(r.unit_price) },
    { key: 'times_used', label: 'Used on bookings', render: r => `${Number(r.times_used)} line${Number(r.times_used) === 1 ? '' : 's'}` },
  ],
  fields: [
    { key: 'service_name', label: 'Service name' },
    { key: 'category', label: 'Category (optional)', required: false },
    { key: 'unit_price', label: 'Unit price', type: 'number', step: '0.01' },
  ],
  validate: b => (Number(b.unit_price) < 0 ? 'Unit price must be zero or greater.' : ''),
});
</script>
</body>
</html>
